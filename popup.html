<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hangly</title>
  <style>
    *{margin:0;padding:0;border:0}
    html,body{width:640px;height:480px;overflow:hidden;background:rgba(0,0,0,0);opacity:1}
    #root{width:640px;height:480px;position:fixed;top:0;left:0}
    canvas{display:block}
    [style*="padding:8px"], .footer{display:none !important}
  </style>
</head>
<body style="background:rgba(0,0,0,0);opacity:1">
  <div id="root">
    <canvas id="c" width="640" height="480"></canvas>
  </div>
  <div style="padding:8px;display:flex;align-items:center;gap:8px;position:fixed;top:0;left:0;z-index:-1">
    <button id="add">Add Item</button>
    <button id="clear">Clear Items</button>
    <div style="flex:1;text-align:right;font-size:12px;color:#aaa">Items: <span id="count">0</span></div>
  </div>
  <div class="footer">Drag items with the mouse or touch; use "Add Item" to spawn more.</div>
  <script src="popup.js"></script>
</body>
</html>
